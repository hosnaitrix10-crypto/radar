name: atualizar-dados
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 1-5"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install pandas lxml requests yfinance
      - name: Coletar
        run: python coleta.py
      - name: Salvar
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados.json
          git commit -m "dados" || echo "sem mudancas"
          git push
